name: Rev1
description: >-
  Rev1 (REV1, Inc.) is a Y Combinator (Winter 2026) startup building an
  AI-powered platform that automatically converts 3D CAD models into fully
  annotated, production-ready 2D manufacturing drawings in minutes instead of
  hours. The software applies ASME Y14.5-2018 geometric dimensioning and
  tolerancing (GD&T) standards, captures design intent, and lets mechanical
  engineers review the design rationale before sharing with manufacturers,
  reportedly recovering roughly 25% of engineering time at hardware companies
  across robotics, aerospace, automotive, medical devices, and consumer
  electronics. As of this enrichment pass the company exposes only a marketing
  site and a demo-request flow — there is no public API, developer portal, SDK,
  or documentation surface to catalog.
